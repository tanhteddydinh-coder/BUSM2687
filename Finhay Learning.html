      { h: L('Lãi đơn và lãi kép', 'Simple vs. compound interest'), p: [
        L('Với <b>lãi đơn</b>, bạn chỉ nhận lãi trên số tiền gốc ban đầu. Với <b>lãi kép</b>, tiền lãi được cộng vào gốc và kỳ sau tiếp tục sinh lãi — “lãi mẹ đẻ lãi con”.', 'With <b>simple interest</b>, you earn interest only on the original principal. With <b>compound interest</b>, interest is added to the principal and itself earns interest in the next period — “interest on interest”.'),
        L('Công thức: <b>Giá trị tương lai = Gốc × (1 + lãi suất)<sup>số năm</sup></b>. Phần tăng trưởng nhỏ ở những năm đầu nhưng lớn dần theo thời gian.', 'Formula: <b>Future value = Principal × (1 + rate)<sup>years</sup></b>. Growth is small in the early years but accelerates over time.')] },
      { h: L('Quy tắc 72', 'The Rule of 72'), p: [
        L('Chia 72 cho lãi suất năm (%) để ước tính số năm cần thiết cho tiền nhân đôi. Với 6%/năm: 72 ÷ 6 ≈ 12 năm. Đây là ước tính nhanh, không phải công thức chính xác.', 'Divide 72 by the annual rate (%) to estimate how many years it takes for money to double. At 6% a year: 72 ÷ 6 ≈ 12 years. It is a quick estimate, not an exact formula.')] },
      { h: L('Đừng quên lạm phát', 'Don’t forget inflation'), p: [
        L('Nếu lãi suất tiền gửi là 6% và lạm phát 4%, sức mua của bạn chỉ tăng khoảng 2%/năm. Đó là <b>lãi suất thực</b>. Một khoản tiền “không đổi” trên sổ sách vẫn có thể mất giá trị thực theo thời gian.', 'If your deposit earns 6% and inflation is 4%, your purchasing power grows only about 2% a year. That is the <b>real interest rate</b>. Money that looks “unchanged” on paper can still lose real value over time.')] },
    ],
    example: { t: L('Ví dụ minh họa', 'Illustrative example'), body: L('Gửi 50 triệu đồng với lãi suất giả định 6%/năm trong 20 năm:<br>• Lãi đơn: 50 + 50 × 6% × 20 = <b>110 triệu</b><br>• Lãi kép: 50 × 1,06<sup>20</sup> ≈ <b>160 triệu</b><br>Khác biệt ~50 triệu đến hoàn toàn từ việc tái đầu tư tiền lãi. Lãi suất thực tế thay đổi theo thời gian và không được đảm bảo.', 'Deposit 50 million VND at an assumed 6% a year for 20 years:<br>• Simple interest: 50 + 50 × 6% × 20 = <b>110 million</b><br>• Compound interest: 50 × 1.06<sup>20</sup> ≈ <b>160 million</b><br>The ~50 million difference comes entirely from reinvesting the interest. Actual rates change over time and are not guaranteed.') },
    takeaways: [L('Bắt đầu sớm quan trọng hơn bắt đầu với số tiền lớn.', 'Starting early matters more than starting big.'), L('Tái đầu tư lợi nhuận tạo hiệu ứng lãi kép.', 'Reinvesting returns is what creates compounding.'), L('Luôn so sánh lợi nhuận với lạm phát.', 'Always compare returns with inflation.')],
    tool: 'compound', asset: 'savings', sim: { route: 'sim/alloc', label: L('Thử thách phân bổ danh mục', 'Portfolio Allocation Challenge') },
    quiz: [
      { q: L('Đầu tư 100 triệu với lãi kép 8%/năm. Sau 2 năm bạn có khoảng bao nhiêu?', 'You invest 100 million at 8% a year, compounded. Roughly how much do you have after 2 years?'), o: [L('116 triệu', '116 million'), L('116,64 triệu', '116.64 million'), L('108 triệu', '108 million'), L('124 triệu', '124 million')], c: 1, e: L('100 × 1,08 × 1,08 = 116,64 triệu. Năm thứ hai, bạn nhận lãi trên cả 8 triệu tiền lãi của năm đầu.', '100 × 1.08 × 1.08 = 116.64 million. In year two you also earn interest on the first year’s 8 million of interest.') },
      { q: L('Theo quy tắc 72, với lợi nhuận 9%/năm, tiền nhân đôi sau khoảng bao lâu?', 'Using the Rule of 72, at 9% a year, about how long does money take to double?'), o: [L('4 năm', '4 years'), L('8 năm', '8 years'), L('12 năm', '12 years'), L('18 năm', '18 years')], c: 1, e: L('72 ÷ 9 = 8 năm (ước tính).', '72 ÷ 9 = 8 years (estimate).') },
      { q: L('Lãi suất tiền gửi 5%/năm, lạm phát 4%/năm. Sức mua của bạn thay đổi khoảng?', 'Your deposit earns 5% a year and inflation is 4%. Roughly how does your purchasing power change?'), o: [L('Tăng ~9%', 'Up ~9%'), L('Tăng ~5%', 'Up ~5%'), L('Tăng ~1%', 'Up ~1%'), L('Giảm ~4%', 'Down ~4%')], c: 2, e: L('Lãi suất thực ≈ 5% − 4% ≈ 1%.', 'Real rate ≈ 5% − 4% ≈ 1%.') },
    ],
  },
  {
    id: 'emergency', module: 'M03', group: 'essentials', diff: 1, minutes: 5,
    title: L('Quỹ dự phòng trước khi đầu tư', 'Build an emergency fund before investing'),
    summary: L('Tấm đệm tài chính giúp bạn không phải bán khoản đầu tư vào thời điểm tệ nhất.', 'A financial cushion so you never have to sell investments at the worst possible moment.'),
    objective: L('Biết cách tính quy mô quỹ dự phòng phù hợp và nơi nên giữ quỹ này.', 'Learn how to size an appropriate emergency fund and where to keep it.'),
    sections: [
      { h: L('Vì sao cần quỹ dự phòng?', 'Why you need an emergency fund'), p: [
        L('Mất việc, ốm đau, sửa nhà… thường xảy ra không báo trước. Nếu không có quỹ dự phòng, bạn có thể buộc phải bán cổ phiếu hoặc vàng đúng lúc giá đang giảm, biến lỗ “trên giấy” thành lỗ thật.', 'Job loss, illness or home repairs rarely come with warning. Without a reserve, you may be forced to sell stocks or gold exactly when prices are down, turning a “paper” loss into a real one.')] },
      { h: L('Nên giữ bao nhiêu?', 'How much should you keep?'), p: [
        L('Cách tính phổ biến: <b>(chi phí thiết yếu + trả nợ hàng tháng) × số tháng</b>. Người có thu nhập ổn định thường chọn 3–6 tháng; người làm tự do, kinh doanh hoặc có người phụ thuộc có thể cần 6–12 tháng. Đây là nguyên tắc tham khảo, không phải quy định cứng.', 'A common rule: <b>(essential expenses + monthly debt payments) × number of months</b>. People with stable salaries often choose 3–6 months; freelancers, business owners or those with dependants may need 6–12 months. This is a guideline, not a hard rule.')] },
      { h: L('Giữ ở đâu?', 'Where to keep it'), p: [
        L('Ở nơi an toàn và rút được nhanh: tiền gửi linh hoạt, tiền gửi kỳ hạn ngắn hoặc quỹ thị trường tiền tệ. Không nên giữ quỹ dự phòng ở cổ phiếu, bất động sản hay tài sản khó bán.', 'Somewhere safe and quickly accessible: flexible deposits, short-term deposits or a money market fund. Do not hold your emergency fund in stocks, property or other hard-to-sell assets.')] },
    ],
    example: { t: L('Ví dụ minh họa', 'Illustrative example'), body: L('Chi phí thiết yếu 12 triệu/tháng, trả góp 3 triệu/tháng → nhu cầu 15 triệu/tháng.<br>Quỹ dự phòng 6 tháng = 15 × 6 = <b>90 triệu đồng</b>.<br>Nếu bạn có 150 triệu tiết kiệm, phần có thể cân nhắc đầu tư chỉ khoảng 60 triệu — trước khi trừ các khoản cần chi sắp tới.', 'Essential expenses of 12 million a month plus 3 million in loan repayments → 15 million a month.<br>A 6-month reserve = 15 × 6 = <b>90 million VND</b>.<br>If you have 150 million in savings, only about 60 million might be considered for investing — before setting aside any upcoming expenses.') },
    takeaways: [L('Quỹ dự phòng là bước đầu tiên, trước mọi khoản đầu tư rủi ro.', 'An emergency fund comes first, before any risky investment.'), L('Tính theo chi phí thiết yếu và nghĩa vụ nợ, không theo thu nhập.', 'Size it on essential costs and debt obligations, not on income.'), L('Ưu tiên an toàn và thanh khoản hơn lợi nhuận.', 'Prioritize safety and liquidity over returns.')],
    tool: 'reserve', asset: 'savings', sim: { route: 'profile', label: L('Cập nhật hồ sơ đầu tư', 'Update your investor profile') },
    quiz: [
      { q: L('Lý do quan trọng nhất để có quỹ dự phòng trước khi đầu tư là gì?', 'What is the most important reason to build an emergency fund before investing?'), o: [L('Để có lợi nhuận cao hơn', 'To earn higher returns'), L('Để không phải bán khoản đầu tư khi giá đang giảm', 'So you never have to sell investments while prices are down'), L('Để được vay ngân hàng dễ hơn', 'To make bank loans easier to get'), L('Để mua được nhiều cổ phiếu hơn', 'To be able to buy more stocks')], c: 1, e: L('Quỹ dự phòng bảo vệ khoản đầu tư khỏi việc phải bán tháo vào thời điểm bất lợi.', 'An emergency fund protects your investments from forced selling at a bad time.') },
      { q: L('Nơi phù hợp nhất để giữ quỹ dự phòng?', 'Where is the best place to keep an emergency fund?'), o: [L('Cổ phiếu tăng trưởng', 'Growth stocks'), L('Tiền gửi linh hoạt / quỹ thị trường tiền tệ', 'Flexible deposits / money market fund'), L('Đất nền', 'Land plots'), L('Vàng miếng', 'Gold bars')], c: 1, e: L('Quỹ dự phòng cần an toàn và rút nhanh.', 'An emergency fund must be safe and quickly accessible.') },
      { q: L('Quỹ dự phòng nên được tính dựa trên?', 'An emergency fund should be sized based on…'), o: [L('Thu nhập hàng tháng', 'Monthly income'), L('Chi phí thiết yếu và khoản trả nợ hàng tháng', 'Essential expenses and monthly debt payments'), L('Tổng tài sản', 'Total assets'), L('Số tiền muốn đầu tư', 'How much you want to invest')], c: 1, e: L('Mục tiêu là duy trì cuộc sống thiết yếu và nghĩa vụ nợ khi thu nhập gián đoạn.', 'The goal is to cover essential living costs and debt obligations if income stops.') },
    ],
  },
  {
    id: 'stocks', module: 'M14', group: 'fundamentals', diff: 1, minutes: 7,
    title: L('Cổ phiếu tạo ra lợi nhuận như thế nào?', 'How do stocks generate returns?'),
    summary: L('Hai nguồn lợi nhuận của cổ phiếu, vì sao giá biến động và vì sao đòn bẩy nguy hiểm.', 'The two sources of stock returns, why prices swing and why leverage is dangerous.'),
    objective: L('Hiểu nguồn lợi nhuận và rủi ro của cổ phiếu, đặc biệt tác động của đòn bẩy (margin).', 'Understand where stock returns and risks come from — especially the effect of leverage (margin).'),
    sections: [
      { h: L('Hai nguồn lợi nhuận', 'Two sources of return'), p: [
        L('<b>Cổ tức</b>: phần lợi nhuận doanh nghiệp chia cho cổ đông (không bắt buộc, không cố định).', '<b>Dividends</b>: the share of profits a company pays to shareholders (not mandatory, not fixed).'),
        L('<b>Chênh lệch giá</b>: bán cao hơn giá mua. Giá phụ thuộc vào kỳ vọng của thị trường về lợi nhuận tương lai và mức định giá nhà đầu tư sẵn sàng trả (ví dụ P/E).', '<b>Capital gains</b>: selling above your purchase price. The price depends on market expectations of future profits and the valuation investors are willing to pay (e.g. the P/E ratio).')] },
      { h: L('Vì sao giá biến động mạnh?', 'Why do prices swing so much?'), p: [
        L('Giá cổ phiếu phản ánh kỳ vọng — và kỳ vọng thay đổi theo tin tức, lãi suất, tâm lý đám đông. Một doanh nghiệp vẫn tăng trưởng lợi nhuận nhưng giá cổ phiếu có thể giảm nếu thị trường đã kỳ vọng nhiều hơn.', 'Share prices reflect expectations — and expectations shift with news, interest rates and crowd psychology. A company can keep growing profits while its share price falls if the market expected even more.')] },
      { h: L('Đòn bẩy khuếch đại cả thua lỗ', 'Leverage magnifies losses too'), p: [
        L('Khi vay ký quỹ 50% để mua cổ phiếu, giá giảm 20% sẽ làm vốn tự có giảm khoảng 40% (chưa tính lãi vay). Nếu giảm sâu hơn, công ty chứng khoán có thể bán giải chấp — bạn mất cơ hội chờ giá phục hồi.', 'If you borrow 50% on margin to buy stocks, a 20% price drop cuts your own equity by about 40% (before interest). If prices fall further, the broker may force-sell your position — and you lose the chance to wait for a recovery.')] },
    ],
    example: { t: L('Ví dụ minh họa', 'Illustrative example'), body: L('Mua 1.000 cổ phiếu giá 50.000 ₫ = 50 triệu đồng. Cổ tức 2.000 ₫/cổ phiếu = 2 triệu.<br>• Kịch bản giá lên 55.000 ₫: lãi giá 5 triệu + cổ tức 2 triệu = <b>+7 triệu (+14%)</b> trước phí, thuế.<br>• Kịch bản giá xuống 40.000 ₫: lỗ giá 10 triệu + cổ tức 2 triệu = <b>−8 triệu (−16%)</b>.<br>Cả hai kịch bản đều có thể xảy ra; không có lợi nhuận nào được đảm bảo.', 'Buy 1,000 shares at 50,000 ₫ = 50 million VND. Dividend of 2,000 ₫ per share = 2 million.<br>• If the price rises to 55,000 ₫: 5 million capital gain + 2 million dividend = <b>+7 million (+14%)</b> before fees and taxes.<br>• If the price falls to 40,000 ₫: 10 million capital loss + 2 million dividend = <b>−8 million (−16%)</b>.<br>Either scenario can happen; no return is guaranteed.') },
    takeaways: [L('Lợi nhuận cổ phiếu = cổ tức + chênh lệch giá, cả hai đều không chắc chắn.', 'Stock return = dividends + price change, and neither is certain.'), L('Biến động ngắn hạn có thể rất lớn so với giá trị doanh nghiệp.', 'Short-term swings can be large relative to a company’s underlying value.'), L('Đòn bẩy làm tăng tốc thua lỗ và rủi ro bị bán giải chấp.', 'Leverage accelerates losses and the risk of forced liquidation.')],
    tool: null, asset: 'stocks', sim: { route: 'sim/stock', label: L('Trình giả lập giao dịch cổ phiếu', 'Stock Trading Simulator') },
    quiz: [
      { q: L('Hai nguồn lợi nhuận chính của cổ phiếu là gì?', 'What are the two main sources of stock returns?'), o: [L('Lãi coupon và gốc', 'Coupons and principal'), L('Cổ tức và chênh lệch giá', 'Dividends and price changes'), L('Tiền thuê và tăng giá', 'Rent and appreciation'), L('Lãi suất cố định', 'A fixed interest rate')], c: 1, e: L('Cổ phiếu sinh lời qua cổ tức và chênh lệch giá mua – bán.', 'Stocks return money through dividends and the difference between buying and selling prices.') },
      { q: L('Lợi nhuận doanh nghiệp tăng nhưng giá cổ phiếu giảm. Điều này có thể xảy ra không?', 'Company profits rise but the share price falls. Can this happen?'), o: [L('Không bao giờ', 'Never'), L('Có, vì giá phản ánh kỳ vọng và tâm lý thị trường', 'Yes, because prices reflect expectations and market sentiment'), L('Chỉ khi có gian lận', 'Only if there is fraud'), L('Chỉ với cổ phiếu nhỏ', 'Only for small companies')], c: 1, e: L('Nếu kết quả thấp hơn kỳ vọng hoặc thị trường chung giảm, giá vẫn có thể giảm.', 'If results miss expectations or the whole market falls, the price can still drop.') },
      { q: L('Vay 50% để mua cổ phiếu, giá giảm 20%. Vốn tự có giảm khoảng?', 'You borrow 50% to buy stocks and the price falls 20%. Roughly how much does your own equity fall?'), o: [L('10%', '10%'), L('20%', '20%'), L('40%', '40%'), L('50%', '50%')], c: 2, e: L('Danh mục 200 → 160; trừ nợ 100 còn 60 so với vốn 100 ban đầu: −40%.', 'Portfolio 200 → 160; minus the 100 loan leaves 60 versus your original 100: −40%.') },
    ],
  },
  {
    id: 'etf', module: 'M16', group: 'fundamentals', diff: 1, minutes: 6,
    title: L('ETF là gì?', 'What is an ETF?'),
    summary: L('Cách đơn giản để đa dạng hóa với số vốn nhỏ — và những điều cần biết về phí.', 'A simple way to diversify with a small amount of money — and what you need to know about fees.'),
    objective: L('Hiểu ETF/quỹ mở hoạt động thế nào, lợi ích đa dạng hóa và tác động dài hạn của phí.', 'Understand how ETFs and open-ended funds work, the benefits of diversification and the long-term impact of fees.'),
    sections: [
      { h: L('ETF hoạt động thế nào?', 'How does an ETF work?'), p: [
        L('ETF (quỹ hoán đổi danh mục) nắm giữ một rổ chứng khoán mô phỏng một chỉ số, ví dụ VN30 gồm 30 cổ phiếu lớn. Khi mua 1 chứng chỉ ETF, bạn gián tiếp sở hữu một phần nhỏ của cả rổ.', 'An ETF (exchange-traded fund) holds a basket of securities that tracks an index — for example VN30, made up of 30 large companies. Buying one ETF unit gives you indirect ownership of a small slice of the whole basket.')] },
      { h: L('Lợi ích đa dạng hóa', 'The benefit of diversification'), p: [
        L('Nếu một cổ phiếu chiếm 5% chỉ số và giảm 30%, tác động lên ETF chỉ khoảng −1,5%. Tuy nhiên, khi <b>toàn thị trường</b> giảm, ETF cũng giảm — đa dạng hóa không loại bỏ rủi ro thị trường.', 'If one stock makes up 5% of the index and falls 30%, the impact on the ETF is only about −1.5%. But when the <b>whole market</b> falls, the ETF falls too — diversification does not remove market risk.')] },
      { h: L('Phí là yếu tố quan trọng', 'Fees matter'), p: [
        L('Chênh lệch 1%/năm về phí nghe nhỏ, nhưng qua 20 năm có thể làm giảm đáng kể tài sản cuối kỳ do hiệu ứng lãi kép ngược. Hãy so sánh phí quản lý, phí mua/bán và mức sai lệch so với chỉ số.', 'A 1% difference in annual fees sounds small, but over 20 years it can significantly reduce your final wealth through reverse compounding. Compare management fees, subscription/redemption fees and tracking error.')] },
    ],
    example: { t: L('Ví dụ minh họa', 'Illustrative example'), body: L('Đầu tư định kỳ 3 triệu/tháng trong 20 năm với lợi nhuận gộp giả định 8%/năm:<br>• Phí 0,6%/năm → khoảng <b>1,64 tỷ</b><br>• Phí 2,0%/năm → khoảng <b>1,39 tỷ</b><br>Chênh lệch ~250 triệu chỉ do phí. Lợi nhuận thực tế có thể cao hơn, thấp hơn hoặc âm.', 'Invest 3 million a month for 20 years at an assumed 8% gross annual return:<br>• 0.6% annual fee → about <b>1.64 billion</b><br>• 2.0% annual fee → about <b>1.39 billion</b><br>A ~250 million difference caused purely by fees. Actual returns may be higher, lower or negative.') },
    takeaways: [L('ETF giúp đa dạng hóa nhanh với vốn nhỏ.', 'ETFs offer instant diversification with little capital.'), L('ETF vẫn giảm khi thị trường chung giảm.', 'ETFs still fall when the overall market falls.'), L('Phí thấp có ý nghĩa lớn trong dài hạn.', 'Low fees make a big difference over the long run.')],
    tool: 'fees', asset: 'funds', sim: { route: 'sim/alloc', label: L('Thử thách phân bổ danh mục', 'Portfolio Allocation Challenge') },
    quiz: [
      { q: L('ETF là gì?', 'What is an ETF?'), o: [L('Một loại tiền gửi ngân hàng', 'A type of bank deposit'), L('Quỹ mô phỏng một chỉ số, giao dịch trên sàn như cổ phiếu', 'A fund that tracks an index and trades on the exchange like a stock'), L('Một loại trái phiếu Chính phủ', 'A type of government bond'), L('Hợp đồng bảo hiểm', 'An insurance contract')], c: 1, e: L('ETF nắm giữ rổ chứng khoán theo chỉ số và được niêm yết trên sàn.', 'An ETF holds a basket of securities matching an index and is listed on an exchange.') },
      { q: L('ETF có thể thua lỗ không?', 'Can an ETF lose money?'), o: [L('Không, vì đã đa dạng hóa', 'No, because it is diversified'), L('Có, khi thị trường chung giảm', 'Yes, when the overall market falls'), L('Chỉ khi quỹ phá sản', 'Only if the fund goes bankrupt'), L('Không, vì được Nhà nước bảo đảm', 'No, because the State guarantees it')], c: 1, e: L('Đa dạng hóa giảm rủi ro riêng lẻ nhưng không loại bỏ rủi ro thị trường.', 'Diversification reduces single-stock risk but does not remove market risk.') },

  /** returns a translation key (wz.err.*) or null */

  /** Core computation — every number has a stated rule */
  compute(a) {
    const income = num(a.income), exp = num(a.expenses), dp = num(a.debtPayment), savings = num(a.savings), nearTerm = num(a.nearTerm);
    const months = num(a.reserveMonths, 6) || 6;

    const reserveFunded = coverage >= months - 0.001;
    const contribution = num(a.contribution);
    const contributionFeasible = Math.max(0, Math.min(contribution, surplus));
    const dti = income > 0 ? dp / income : dp > 0 ? 1 : 0;
    const nearCovered = savings >= reserveGap + nearTerm;
    const highDebt = a.highInterestDebt === 'yes';

    // --- D. Risk capacity (financial ability to absorb losses) — 100 pts
    const hPts = { lt1: 0, '1-3': 10, '3-5': 20, gt5: 30 }[a.horizon] ?? 0;
    const rPts = coverage >= 6 ? 20 : coverage >= 3 ? 10 : 0;
    let dPts = dti < 0.15 ? 20 : dti < 0.35 ? 10 : 0; if (highDebt) dPts = Math.max(0, dPts - 5);
    const ratio = savings > 0 ? nearTerm / savings : nearTerm > 0 ? 1 : 0;
    const nPts = nearTerm <= 0 ? 15 : ratio < 0.25 ? 8 : 0;
    const sPts = { stable: 10, variable: 5, unstable: 0 }[a.stability] ?? 0;
    const depPts = { none: 5, few: 3, many: 0 }[a.dependents] ?? 0;
    const capParts = [
      { id: 'horizon', pts: hPts, max: 30, p: { hz: a.horizon } },
      { id: 'coverage', pts: rPts, max: 20, p: { cov: coverage } },
      { id: 'dti', pts: dPts, max: 20, p: { pct: dti, high: highDebt } },
      { id: 'near', pts: nPts, max: 15, p: { pct: Math.min(ratio, 9.99), has: nearTerm > 0 } },
      { id: 'stability', pts: sPts, max: 10, p: { v: a.stability } },
      { id: 'dependents', pts: depPts, max: 5, p: { v: a.dependents } },
    ];
    const capScore = sum(capParts.map((x) => x.pts));
    const capLevel = this.level5(capScore);

    // --- E. Risk tolerance (psychological) — weighted 0–100
    const dropS = { sellall: 0, sellpart: 30, hold: 65, buymore: 100 }[a.drop] ?? 50;
    const tradeS = { A: 10, B: 55, C: 100 }[a.tradeoff] ?? 50;
    const feelS = { anxious: 10, uneasy: 45, calm: 85 }[a.feeling] ?? 50;
    const tolParts = [
      { id: 'drop', pts: Math.round(dropS * 0.45), max: 45 },
      { id: 'tradeoff', pts: Math.round(tradeS * 0.35), max: 35 },
      { id: 'feeling', pts: Math.round(feelS * 0.2), max: 20 },
    ];
    const tolScore = sum(tolParts.map((x) => x.pts));
    const tolLevel = this.level5(tolScore);

    const correct = this.QUIZ.filter((q) => a.quiz && a.quiz[q.id] === q.c).map((q) => q.id);

      if (ex === 2) k = Math.min(3, k + 1);
      if (ex === 0) k = Math.min(k, 2);

    const rdParts = [
      { id: 'surplus', pts: surplus <= 0 ? 0 : surplus < income * 0.1 ? 15 : 25, max: 25, p: { amt: surplus } },
      { id: 'reserve', pts: reserveFunded ? 25 : coverage >= 3 ? 12 : 0, max: 25, p: { funded: reserveFunded, months, amt: reserveShort } },
      { id: 'dti', pts: dti < 0.35 ? 20 : dti < 0.5 ? 10 : 0, max: 20, p: { pct: dti } },
      { id: 'highdebt', pts: highDebt ? 0 : 15, max: 15, p: { has: highDebt } },
      { id: 'near', pts: nearCovered ? 15 : 0, max: 15, p: { has: nearTerm > 0, covered: nearCovered } },
    ];

    const readiness = rdScore >= 80 ? { status: 'ready', tone: 'pos' } : rdScore >= 50 ? { status: 'conditional', tone: 'warn' } : { status: 'weak', tone: 'neg' };

    if (dti >= 0.35) w('warn', 'dti', { pct: dti });
    if (contribution > Math.max(0, surplus) && contribution > 0) w('warn', 'contribution', { amtC: contribution, amtS: Math.max(0, surplus), amtF: contributionFeasible });
    if (nearTerm > 0) w('info', 'near', { amt: nearTerm });
    if (tolLevel > capLevel + 1) w('warn', 'tolAboveCap', { tol: this.TOL_LABEL[tolLevel], cap: this.CAP_LABEL[capLevel] });
    if (capLevel > tolLevel + 1) w('info', 'capAboveTol');

    if (anyInvested && nC <= 2) w('info', 'expVsQuiz');

      investable, coverage, reserveFunded, contribution, contributionFeasible, dti, highDebt,
      goals: a.goals || [], horizon: a.horizon, horizonYears: this.horizonYears(a.horizon),
      capacity: { score: capScore, level: capLevel, parts: capParts },
      tolerance: { score: tolScore, level: tolLevel, parts: tolParts },
      knowledge: { correct, nCorrect: nC, total: this.QUIZ.length, overall: generalK, perAsset },
      readiness: Object.assign({ score: rdScore, parts: rdParts }, readiness),
      effRisk, warnings: W,

/* =====================================================================
   SUITABILITY ENGINE — rule-based, explainable matching (codes + params)
   ===================================================================== */
const SuitabilityEngine = {
  STATUS: { consider: { cls: 'b-pos' }, review: { cls: 'b-warn' }, notyet: { cls: 'b-neg' } },
  evaluate(p, asset) {
    const fits = [], concerns = [];
    const fit = (id, q = {}) => fits.push({ id, p: q });
    const add = (id, q = {}, major = false) => concerns.push({ id, p: q, major });
    const eff = p.effRisk, hy = p.horizonYears, k = p.knowledge.perAsset[asset.id] ?? 0;
    // risk vs effective risk level (min of capacity & tolerance)
    if (asset.risk > eff + 1) add('riskHigh', { risk: asset.risk, eff }, true);
    else if (asset.risk === eff + 1) add('riskPlus1', { risk: asset.risk, eff });
    else fit('riskOk', { risk: asset.risk, eff });
    // horizon
    if (hy < asset.horizonMin) add('hzShort', { hz: p.horizon, min: asset.horizonMin }, asset.horizonMin - hy >= 2);
    else fit('hzOk', { hz: p.horizon });
    // capital
    if (asset.id !== 'savings') {
      if (p.investable <= 0) add('capNone', {}, true);
      else if (p.investable < asset.capMin) add('capLow', { amt: p.investable, cap: asset.capText }, asset.id === 'realestate');
      else fit('capOk', { amt: p.investable });
    }
    // knowledge
    if (k < asset.kreq) add('kLow', { k, kreq: asset.kreq }, asset.kreq - k >= 2);
    else fit('kOk', { k, kreq: asset.kreq });
    // readiness
    if (p.readiness.score < 50 && asset.id !== 'savings') add('readyWeak', {}, true);
    // goals
    const g = p.goals;
    if (g.includes('preserve') && ['stocks', 'gold', 'realestate'].includes(asset.id)) add('goalPreserve');
    if (g.includes('preserve') && ['savings', 'bonds'].includes(asset.id)) fit('goalPreserve');
    if (g.includes('income') && ['savings', 'bonds', 'realestate'].includes(asset.id)) fit('goalIncome');
    if (asset.id === 'gold') add('goldNoCf');
    if (['growth', 'accumulate', 'retire'].some((x) => g.includes(x)) && ['funds', 'stocks'].includes(asset.id) && hy >= asset.horizonMin) fit('goalGrowth');
    if (g.includes('home') && ['lt1', '1-3'].includes(p.horizon) && ['stocks', 'funds', 'gold'].includes(asset.id)) add('goalHome');
    // real estate specifics: leverage & liquidity
    if (asset.id === 'realestate') {

/** Format raw engine params for display by naming convention (keeps engines text-free). */
function fp(p = {}) {
  const o = {};
  Object.entries(p).forEach(([k, v]) => {
    if (v && typeof v === 'object' && ('vi' in v)) o[k] = tx(v);
    else if (k === 'hz') o[k] = AssessmentEngine.horizonLabel(v);
    else if (k === 'cap') o[k] = tx(v).toLowerCase();
    else if (k.startsWith('vnd')) o[k] = Fmt.vnd(v);
    else if (k.startsWith('amt')) o[k] = Fmt.short(v);
    else if (k.startsWith('pct')) o[k] = Fmt.pct(v, 0);
    else if (k.startsWith('pc1')) o[k] = Fmt.pct(v, 1);
    else if (k.startsWith('sp')) o[k] = Fmt.spct(v);
    else if (k.startsWith('qty')) o[k] = Fmt.n(v);

}

/* =====================================================================
   PORTFOLIO ENGINE — virtual account, orders, P&L
   ===================================================================== */
const PortfolioEngine = {
  FEE: 0.0015, SELL_TAX: 0.001, LOT: 100,
  create(capital) { return { capital, cash: capital, positions: {}, orders: [], realized: 0, fees: 0, taxes: 0 }; },
  estimate(side, qty, price) {
    const value = qty * price, fee = value * this.FEE, tax = side === 'sell' ? value * this.SELL_TAX : 0;
    return { value, fee, tax, total: side === 'buy' ? value + fee : value - fee - tax };
  },
  maxBuyQty(cash, price) { if (!(price > 0)) return 0; return Math.floor(cash / (price * (1 + this.FEE)) / this.LOT) * this.LOT; },
  /** returns null or {k, p} (translation key + raw params) */
  validate(acc, side, sym, qty, price) {
    if (!isNum(qty) || qty <= 0) return { k: 'st.err.qty', p: {} };
    if (qty % this.LOT !== 0) return { k: 'st.err.lot', p: { lot: this.LOT } };
    if (!(price > 0)) return { k: 'st.err.price', p: {} };
    const est = this.estimate(side, qty, price);
    if (side === 'buy' && est.total > acc.cash + 0.5) return { k: 'st.err.cash', p: { vndNeed: est.total, vndCash: acc.cash } };
    if (side === 'sell') { const held = acc.positions[sym] ? acc.positions[sym].qty : 0; if (qty > held) return { k: 'st.err.oversell', p: { qty, sym, qtyHeld: held } }; }
    return null;
  },
  execute(acc, side, sym, qty, price, meta = {}) {
    const err = this.validate(acc, side, sym, qty, price); if (err) return { ok: false, err };
    const est = this.estimate(side, qty, price); let pnl = null;
    if (side === 'buy') {
      const p = acc.positions[sym] || { qty: 0, avg: 0 };
      p.avg = (p.qty * p.avg + est.total) / (p.qty + qty); p.qty += qty; acc.positions[sym] = p; acc.cash -= est.total;
    } else {
      const p = acc.positions[sym]; pnl = est.total - qty * p.avg; p.qty -= qty; acc.realized += pnl; acc.cash += est.total;
      if (p.qty === 0) delete acc.positions[sym];
    }
    acc.fees += est.fee; acc.taxes += est.tax;
    const order = Object.assign({ id: uid(), side, sym, qty, price, value: est.value, fee: est.fee, tax: est.tax, total: est.total, pnl }, meta);
    acc.orders.unshift(order);
    return { ok: true, order };
  },
  value(acc, priceOf) {
    let mv = 0, cost = 0;
    Object.entries(acc.positions).forEach(([s, p]) => { const px = priceOf(s); mv += p.qty * px; cost += p.qty * p.avg; });
    const total = acc.cash + mv;
    return { mv, cost, unrealized: mv - cost, total, ret: acc.capital > 0 ? total / acc.capital - 1 : 0 };
  },
};

  reCalc(inp, scen = {}) {

   ===================================================================== */
const LearningEngine = {
  isDone(id) { return !!(Store.state.lessons[id] && Store.state.lessons[id].done); },
  complete(id, score, total) {
    const passed = score >= Math.ceil(total * 2 / 3);
    const prev = Store.state.lessons[id];
    Store.update((s) => { s.lessons[id] = { done: passed || !!(prev && prev.done), score, total, at: Date.now() }; });
    return passed;
  },
  progress() { const done = LESSONS.filter((l) => this.isDone(l.id)).length; return { done, total: LESSONS.length, pct: done / LESSONS.length }; },
  /** returns [{id, why:{k,p}}] */
  recommend(p) {
    const out = []; const push = (id, k, q = {}) => { if (!out.find((x) => x.id === id) && !this.isDone(id)) out.push({ id, why: { k: 'rec.' + k, p: q } }); };
    if (!p) { push('emergency', 'first'); push('compound', 'basics'); push('etf', 'diversify'); push('portfolioloss', 'riskFirst'); return out; }
    const k = p.knowledge.perAsset;

  if (el._lcRender) { el._lcRender(el.clientWidth || 600); return; } // update in place, reuse observer
  const render = (W) => {
    const { labels, series, height = 260, yFmt = Fmt.short, zero = false, bands = null } = el._lcOpts;

    if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }

    if (zero && lo < 0 && hi > 0) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--border-strong)"/>`;
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 70))));

    if (bands) { const [a, b] = bands; s += `<path d="${a.values.map((v, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(v)).join(' ')} ${b.values.map((v, i) => 'L' + x(b.values.length - 1 - i) + ' ' + y(b.values[b.values.length - 1 - i])).join(' ')} Z" fill="var(--accent)" opacity=".08"/>`; }

function donutSVG(parts, { size = 200, thick = 30, center = '', sub = '' } = {}) {
  const r = size / 2 - thick / 2 - 2, c = size / 2, total = sum(parts.map((p) => p.v)) || 1; let a0 = -Math.PI / 2; let s = '';
  s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${thick}"/>`;
  parts.forEach((p) => {
    if (p.v <= 0) return; const a1 = a0 + (p.v / total) * Math.PI * 2; const large = a1 - a0 > Math.PI ? 1 : 0;
    if (p.v / total > 0.9999) { s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${thick}"/>`; }
    else s += `<path d="M ${c + r * Math.cos(a0)} ${c + r * Math.sin(a0)} A ${r} ${r} 0 ${large} 1 ${c + r * Math.cos(a1)} ${c + r * Math.sin(a1)}" fill="none" stroke="${p.color}" stroke-width="${thick}"/>`;
    a0 = a1;
  });
  s += `<text x="${c}" y="${c - 2}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)" font-family="var(--font)">${esc(center)}</text><text x="${c}" y="${c + 18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--font)">${esc(sub)}</text>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" role="img" aria-label="${esc(t('chart.donut'))}">${s}</svg>`;
}

function radarSVG(axes, { size = 340 } = {}) {
  const c = size / 2, R = size / 2 - 70, n = axes.length; const pt = (i, v) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return [c + Math.cos(a) * R * v, c + Math.sin(a) * R * v]; };

const NAV = [['overview', 'home'], ['profile', 'user'], ['explore', 'compass'], ['sim', 'play'], ['learn', 'book'], ['dashboard', 'grid']];

    App.showShell();
    const key = Views[name] ? name : 'overview';
    const view = $('#view'); const y = window.scrollY;
    if (key !== 'explore') $('#compareBarHost').innerHTML = '';
    view.innerHTML = '';
    let crumbs;
    try { crumbs = Views[key](view, params); }
    catch (e) { console.error(e); view.innerHTML = `<div class="card">${UI.empty('alert', t('c.errorPage'), esc(e.message), `<button class="btn btn-primary" data-go="overview">${t('c.toOverview')}</button>`)}</div>`; }
    App.setNav(key); App.setCrumbs(crumbs || [{ label: t('nav.' + key) }]); App.renderSide();
    if (keep) window.scrollTo(0, y);
    else {
      window.scrollTo(0, 0); view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
      if (!this.first) { const h1 = view.querySelector('h1'); if (h1) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); } }
    }
    this.first = false; App.closeNav();
  },
  refresh() { this.render(true); },
};

    this.applyTheme(document.documentElement.dataset.theme || 'light', false);

  /** Language changed: re-render in place, keeping route, scroll, form values, open sections, modals and toasts. */
  relocalize() {
    const pubVisible = !$('#public').hidden;
    const root = pubVisible ? $('#public') : $('#view');
    const snap = FormState.capture(root);
    this.renderShellText();
    Router.refresh();
    FormState.restore(pubVisible ? $('#public') : $('#view'), snap);
    UI.relocalizeModals(); UI.relocalizeToasts(); UI.hideHelp();

  /* ---- shell visibility: public screens and the authenticated app never show together ---- */
  showShell() { const pub = $('#public'); if (!pub.hidden) { pub.hidden = true; pub.innerHTML = ''; } $('#appShell').hidden = false; },
  hideShell() { $('#appShell').hidden = true; $('#compareBarHost').innerHTML = ''; this.closeNav(); this.closeAccountMenu(); },
  /* ---- account menu & logout ---- */
  bindAccountMenu() {
    const btn = $('#acctBtn'), menu = $('#acctMenu');
    const items = () => $$('[role=menuitem]', menu);
    btn.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden ? this.openAccountMenu() : this.closeAccountMenu(); });
    btn.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); this.openAccountMenu(); } });
    menu.addEventListener('keydown', (e) => {
      const list = items(); const i = list.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
      if (e.key === 'Escape') { e.stopPropagation(); this.closeAccountMenu(); btn.focus(); }
      if (e.key === 'Tab') this.closeAccountMenu();
    });
    document.addEventListener('click', (e) => { if (!menu.hidden && !e.target.closest('#acct')) this.closeAccountMenu(); });

  closeAccountMenu() { const m = $('#acctMenu'); if (m && !m.hidden) { m.hidden = true; $('#acctBtn').setAttribute('aria-expanded', 'false'); } },
  logout() {

const Explain = {
  capLabel: (id) => t('cap.' + id),
  capNote(x) {
    const q = x.p || {};
    switch (x.id) {
      case 'horizon': return AssessmentEngine.horizonLabel(q.hz);
      case 'coverage': return (q.cov >= 99 ? '—' : t('u.monthsN', { n: Fmt.n(q.cov, 1) })) + ' ' + t('cap.n.coverage');
      case 'dti': return t('cap.n.dti', { pct: Fmt.pct(q.pct, 0) }) + (q.high ? t('cap.n.dtiHigh') : '');
      case 'near': return q.has ? t('cap.n.near', { pct: Fmt.pct(q.pct, 0) }) : t('c.none');
      case 'stability': return q.v ? t('opt.stab.' + q.v) : '—';
      case 'dependents': return q.v ? t('opt.dep.' + q.v) : '—';
    }
    return '';
  },
  rdNote(x) {
    const q = x.p || {};
    switch (x.id) {
      case 'surplus': return Fmt.short(q.amt) + t('u.perMonth');
      case 'reserve': return q.funded ? t('rd.n.funded', { n: q.months }) : t('rd.n.short', { amt: Fmt.short(q.amt) });
      case 'dti': return Fmt.pct(q.pct, 0);
      case 'highdebt': return q.has ? t('rd.n.has') : t('c.no');
      case 'near': return q.has ? (q.covered ? t('rd.n.covered') : t('rd.n.notCovered')) : t('c.none');
    }
    return '';
  },
  warning: (w) => t('warn.' + w.id, fp(w.p)),
  fit: (f) => t('fit.' + f.id, fp(f.p)),
  concern: (c) => t('con.' + c.id, fp(c.p)),
};

/* =====================================================================
   VIEW: EXPLORE INVESTMENTS

const ExploreF = { cap: '', hor: '', risk: '', group: '', k: '' };
const CompareSel = [];
const DetailTab = {}; // assetId -> selected tab (survives re-render / language switch)
Views.explore = (root, params) => {
  if (params[0] && ASSET[params[0]]) return renderAssetDetail(root, ASSET[params[0]], params[1]);
  const p = Store.state.profile;
  root.innerHTML = `
    ${R.pageHead(t('nav.explore'), t('ex.title'), t('ex.desc'))}
    ${p ? `<div class="notice info" style="margin-bottom:16px">${Icons('user')}<span>${t('ex.profileNote', { eff: p.effRisk, amt: Fmt.short(p.investable), hz: AssessmentEngine.horizonLabel(p.horizon) })} <a href="#/profile">${t('ex.seeWhy')}</a></span></div>`
      : `<div class="notice" style="margin-bottom:16px">${Icons('info')}<div class="between" style="flex:1;flex-wrap:wrap"><span>${t('ex.noProfile')}</span><button class="link-btn" data-go="profile/edit">${t('ov.ctaStart')} ${Icons('arrow')}</button></div></div>`}
    <form class="card filters" id="filters" aria-label="${esc(t('ex.filtersAria'))}">
      <div class="field"><label class="lbl" for="fCap">${t('ex.fCap')}</label><select id="fCap" name="cap"><option value="">${t('c.all')}</option><option value="${50 * M}">${t('ex.cap50')}</option><option value="${500 * M}">${t('ex.cap500')}</option><option value="${2 * B}">${t('ex.cap2b')}</option><option value="${1e13}">${t('ex.capOver')}</option></select></div>
      <div class="field"><label class="lbl" for="fHor">${t('ex.fHor')}</label><select id="fHor" name="hor"><option value="">${t('c.all')}</option>${AssessmentEngine.HORIZONS.map(([v, l, y]) => `<option value="${y}">${tx(l)}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl" for="fRisk">${t('ex.fRisk')}</label><select id="fRisk" name="risk"><option value="">${t('c.all')}</option><option value="low">${t('ex.rLow')}</option><option value="mid">${t('ex.rMid')}</option><option value="high">${t('ex.rHigh')}</option></select></div>
      <div class="field"><label class="lbl" for="fGroup">${t('ex.fGroup')}</label><select id="fGroup" name="group"><option value="">${t('c.all')}</option>${Object.entries(GROUPS).map(([k, l]) => `<option value="${k}">${tx(l)}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl" for="fK">${t('ex.fK')}</label><select id="fK" name="k"><option value="">${t('c.all')}</option>${AssessmentEngine.K_LABEL.map((l, i) => `<option value="${i}">${tx(l)}</option>`).join('')}</select></div>
      <button type="button" class="btn btn-ghost" id="fReset">${t('ex.clear')}</button>
    </form>
    <div class="between" style="margin-bottom:12px"><span class="small muted" id="fCount"></span>${p ? `<button class="btn btn-ghost btn-sm" id="fMine">${Icons('user')} ${t('ex.mine')}</button>` : ''}</div>
    <div class="grid g-3" id="assetGrid"></div>`;
  const form = $('#filters', root);
  Object.entries(ExploreF).forEach(([k, v]) => { const el = form.elements[k]; if (el) el.value = v; });
  const draw = () => {
    const list = ASSETS.filter((a) => {
      if (ExploreF.cap && a.capMin > +ExploreF.cap) return false;
      if (ExploreF.hor !== '' && a.horizonMin > +ExploreF.hor) return false;
      if (ExploreF.risk === 'low' && a.risk > 2) return false; if (ExploreF.risk === 'mid' && a.risk !== 3) return false; if (ExploreF.risk === 'high' && a.risk < 4) return false;
      if (ExploreF.group && a.group !== ExploreF.group) return false;
      if (ExploreF.k !== '' && a.kreq > +ExploreF.k) return false;
      return true;
    });
    $('#fCount', root).textContent = t('ex.count', { n: list.length, total: ASSETS.length });
    $('#assetGrid', root).innerHTML = list.length ? list.map((a) => assetCard(a, p)).join('') : `<div class="card" style="grid-column:1/-1">${UI.empty('compass', t('ex.emptyT'), t('ex.emptyD'), `<button class="btn btn-secondary" id="fReset2">${t('ex.clearAll')}</button>`)}</div>`;
    const r2 = $('#fReset2', root); r2 && r2.addEventListener('click', reset);
  };
  const reset = () => { Object.keys(ExploreF).forEach((k) => { ExploreF[k] = ''; form.elements[k].value = ''; }); draw(); };
  form.addEventListener('change', (e) => { ExploreF[e.target.name] = e.target.value; draw(); });
  $('#fReset', root).addEventListener('click', reset);
  const mine = $('#fMine', root);
  mine && mine.addEventListener('click', () => {
    const inv = p.investable; ExploreF.cap = inv < 50 * M ? String(50 * M) : inv < 500 * M ? String(500 * M) : inv < 2 * B ? String(2 * B) : String(1e13);
    ExploreF.hor = String(p.horizonYears); ExploreF.k = String(Math.max(...Object.values(p.knowledge.perAsset))); ExploreF.risk = ''; ExploreF.group = '';
    Object.entries(ExploreF).forEach(([k, v]) => { form.elements[k].value = v; }); draw(); UI.toast(() => t('ex.mineToast'), 'info');
  });
  $('#assetGrid', root).addEventListener('change', (e) => {
    const cb = e.target.closest('[data-cmp]'); if (!cb) return;
    const id = cb.dataset.cmp; const i = CompareSel.indexOf(id);
    if (cb.checked && i < 0) { if (CompareSel.length >= 3) { cb.checked = false; UI.toast(() => t('ex.max3'), 'warn'); return; } CompareSel.push(id); }
    if (!cb.checked && i >= 0) CompareSel.splice(i, 1);
    renderCompareBar();
  });
  draw(); renderCompareBar();
  return [{ label: t('nav.explore') }];
};

function renderCompareBar() {
  const host = $('#compareBarHost');
  if (!CompareSel.length) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="compare-bar" role="region" aria-label="${esc(t('ex.cbAria'))}">
    <span class="small strong">${t('ex.compare')}</span><div class="cb-chips">${CompareSel.map((id) => `<span class="cb-chip">${tx(ASSET[id].name)}<button data-rm="${id}" aria-label="${esc(t('ex.remove', { name: tx(ASSET[id].name) }))}">×</button></span>`).join('')}</div>
    <button class="btn btn-primary btn-sm" id="cbGo" ${CompareSel.length < 2 ? 'disabled' : ''}>${CompareSel.length < 2 ? t('ex.pickOne') : t('ex.compareN', { n: CompareSel.length })}</button>
    <button class="btn btn-sm" style="color:#fff" id="cbClear">${t('ex.clearSel')}</button></div>`;
  host.querySelector('#cbGo').addEventListener('click', openCompare);
  host.querySelector('#cbClear').addEventListener('click', () => { CompareSel.length = 0; $$('[data-cmp]').forEach((c) => { c.checked = false; }); renderCompareBar(); });
  host.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { const i = CompareSel.indexOf(b.dataset.rm); CompareSel.splice(i, 1); const cb = $(`[data-cmp="${b.dataset.rm}"]`); if (cb) cb.checked = false; renderCompareBar(); }));
}

  const drawSyms = () => {
    $('#symList', root).innerHTML = syms.map((m) => { const c = price(m.sym), pv = price(m.sym, st.session - 1), ch = c / pv - 1; return `<button type="button" class="sym-btn ${m.sym === st.symbol ? 'on' : ''}" data-sym="${m.sym}" aria-pressed="${m.sym === st.symbol}"><div class="s">${m.sym}</div><div class="c">${Fmt.price(c)} <span class="${ch >= 0 ? 'pos' : 'neg'}">${ch >= 0 ? '▲' : '▼'}${Fmt.n(Math.abs(ch * 100), 1)}%</span></div></button>`; }).join('');

    $('#symPrice', root).innerHTML = `<span class="strong">${m.sym}</span><span class="small muted">${esc(tx(m.name))} · ${esc(tx(m.sector))}</span><span class="px">${Fmt.price(c)} ₫</span>${Fmt.delta(c / pv - 1)}`;

    const markers = st.acc.orders.filter((o) => o.sym === st.symbol).map((o) => ({ i: st.interval === 'W' ? weekIdx(data, o.session) : o.session, side: o.side }));
    chart.opts.ma = st.ma; chart.opts.labelFn = st.interval === 'W' ? (d) => t('chart.week', { d: Fmt.dateShort(d.time) }) : (d, i, full) => (full ? Fmt.date(d.time) : Fmt.dateShort(d.time));
    chart.setData(data, { markers, label: t('chart.ariaSim', { sym: st.symbol }) });
  };
  const drawKPIs = () => {
    const v = PortfolioEngine.value(st.acc, (s) => price(s));
    $('#kpis', root).innerHTML = UI.kpi(t('st.kTotal'), Fmt.short(v.total), Fmt.delta(v.ret) + ` <span class="muted">${t('c.vsCapital')}</span>`, { cls: 'accent' }) + UI.kpi(t('st.kCash'), Fmt.short(st.acc.cash), t('st.kCashS', { pct: Fmt.pct(st.acc.cash / v.total, 0) })) +
      UI.kpi(t('st.kUnreal'), Fmt.delta(v.unrealized, 'short'), v.cost > 0 ? t('st.kUnrealS', { pct: Fmt.spct(v.unrealized / v.cost) }) : t('st.noHold'), { help: 'unrealized' }) +
      UI.kpi(t('st.kReal'), Fmt.delta(st.acc.realized, 'short'), t('st.kRealS'), { help: 'realized' }) + UI.kpi(t('st.kFees'), Fmt.short(st.acc.fees + st.acc.taxes), t('st.nOrders', { n: st.acc.orders.length }), { help: 'fees' });
    const d = MarketDataAdapter.bar(st.uni, 'FPT', st.session);
    $('#sessLbl', root).textContent = t('st.sessLbl', { date: Fmt.date(d.time), n: st.session - SimulationEngine.STOCK_START + 1 });
    $('#sessLeft', root).textContent = st.session >= maxIdx ? t('st.noMore') : t('st.left', { n: maxIdx - st.session });
    $('#next1', root).disabled = $('#next5', root).disabled = st.session >= maxIdx;
  };
  const drawEst = () => {
    const side = StockUI.side; const sym = $('#ordSym', root).value; const px = price(sym); const qty = Math.max(0, Math.floor(+$('#qty', root).value || 0));
    const e = PortfolioEngine.estimate(side, qty, px); const held = st.acc.positions[sym] ? st.acc.positions[sym].qty : 0;
    $('#est', root).innerHTML = `<div class="order-row"><span>${t('st.fillPx')}</span><b>${Fmt.price(px)} ₫</b></div>
      <div class="order-row"><span>${t('st.value')}</span><b>${Fmt.vnd(e.value)}</b></div>
      <div class="order-row"><span>${t('st.fee')} ${help('fees')}</span><b>${Fmt.vnd(e.fee)}</b></div>
      ${side === 'sell' ? `<div class="order-row"><span>${t('st.tax')}</span><b>${Fmt.vnd(e.tax)}</b></div>` : ''}
      <div class="order-row total"><span class="strong" style="color:var(--text)">${side === 'buy' ? t('st.totalNeed') : t('st.proceeds')}</span><b>${Fmt.vnd(e.total)}</b></div>
      <div class="order-row"><span>${side === 'buy' ? t('st.power') : t('st.holding')}</span><b>${side === 'buy' ? Fmt.vnd(st.acc.cash) : Fmt.n(held) + ' ' + t('u.shares')}</b></div>
      <div class="order-row"><span>${side === 'buy' ? t('st.maxBuy') : t('st.maxSell')}</span><b>${Fmt.n(side === 'buy' ? PortfolioEngine.maxBuyQty(st.acc.cash, px) : held)} ${t('u.shares')}</b></div>`;
    const btn = $('#placeBtn', root); btn.className = 'btn btn-lg btn-block mt-12 ' + (side === 'buy' ? 'btn-buy' : 'btn-sell');
    btn.textContent = t(side === 'buy' ? 'st.placeBuy' : 'st.placeSell', { qty: qty ? Fmt.n(qty) + ' ' : '', sym });
    $('#ordErr', root).innerHTML = StockUI.err ? Icons('alert', 15) + esc(tm(StockUI.err)) : '';
  };
  const drawBottom = () => {
    $$('#btTabs [data-bt]', root).forEach((b) => b.setAttribute('aria-selected', String(b.dataset.bt === StockUI.tab)));
    const el = $('#bottom', root); const v = PortfolioEngine.value(st.acc, (s) => price(s));
    if (StockUI.tab === 'positions') {
      const pos = Object.entries(st.acc.positions);
      el.innerHTML = pos.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('st.thSym')}</th><th class="r">${t('st.thQty')}</th><th class="r">${t('st.thAvg')} ${help('avgcost')}</th><th class="r">${t('st.thPx')}</th><th class="r">${t('st.thValue')}</th><th class="r">${t('st.thUnreal')}</th><th class="r">${t('st.thWeight')}</th><th></th></tr></thead><tbody>
        ${pos.map(([s, p]) => { const px = price(s), mv = p.qty * px, pl = mv - p.qty * p.avg; return `<tr><td class="strong">${s}</td><td class="r">${Fmt.n(p.qty)}</td><td class="r">${Fmt.price(p.avg)}</td><td class="r">${Fmt.price(px)}</td><td class="r">${Fmt.vnd(mv)}</td><td class="r">${Fmt.delta(pl, 'vnd')}<div class="xs">${Fmt.delta(pl / (p.qty * p.avg))}</div></td><td class="r">${Fmt.pct(mv / v.total, 1)}</td><td class="r"><button class="btn btn-ghost btn-xs" data-sellall="${s}">${t('st.sell')}</button></td></tr>`; }).join('')}
        <tr><td class="strong">${t('c.cash')}</td><td></td><td></td><td></td><td class="r">${Fmt.vnd(st.acc.cash)}</td><td></td><td class="r">${Fmt.pct(st.acc.cash / v.total, 1)}</td><td></td></tr></tbody></table></div>`
        : UI.empty('wallet', t('st.noPosT'), t('st.noPosD', { amt: Fmt.short(st.acc.cash) }));
    } else if (StockUI.tab === 'orders') {
      el.innerHTML = st.acc.orders.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('st.thDate')}</th><th>${t('st.thSide')}</th><th>${t('st.thSym')}</th><th class="r">${t('st.thQty')}</th><th class="r">${t('st.thFill')}</th><th class="r">${t('st.thValue')}</th><th class="r">${t('st.thFees')}</th><th class="r">${t('st.thReal')}</th></tr></thead><tbody>
        ${st.acc.orders.map((o) => `<tr><td>${Fmt.date(MarketDataAdapter.bar(st.uni, o.sym, o.session).time)}</td><td><span class="badge ${o.side === 'buy' ? 'b-pos' : 'b-neg'}">${t(o.side === 'buy' ? 'st.BUY' : 'st.SELL')}</span></td><td class="strong">${o.sym}</td><td class="r">${Fmt.n(o.qty)}</td><td class="r">${Fmt.price(o.price)}</td><td class="r">${Fmt.vnd(o.value)}</td><td class="r">${Fmt.vnd(o.fee + o.tax)}</td><td class="r">${o.pnl === null ? '<span class="muted">—</span>' : Fmt.delta(o.pnl, 'vnd')}</td></tr>`).join('')}</tbody></table></div>`
        : UI.empty('doc', t('st.noOrdT'), t('st.noOrdD'));
    } else {
      el.innerHTML = `<div class="grid g-4">${UI.kpi(t('st.pRet'), Fmt.delta(v.ret))}${UI.kpi(t('st.pEtf'), Fmt.delta(price('E1SIM') / price('E1SIM', SimulationEngine.STOCK_START) - 1), t('st.pEtfS'), { help: 'benchmark' })}${UI.kpi(t('st.pSessions'), Fmt.n(st.session - SimulationEngine.STOCK_START))}${UI.kpi(t('st.pCost'), Fmt.pct((st.acc.fees + st.acc.taxes) / st.capital, 2))}</div><div id="eqChart" class="mt-16"></div><div class="legend mt-8"><span><i style="background:var(--accent)"></i>${t('st.lgTotal')}</span><span><i style="background:var(--c6)"></i>${t('st.lgEtf')}</span></div>`;
      const eq = st.equity; const b0 = price('E1SIM', eq[0].s);
      lineChart($('#eqChart', el), { labels: eq.map((e) => Fmt.dateShort(MarketDataAdapter.bar(st.uni, 'FPT', e.s).time)), height: 240, series: [{ name: t('st.lgPortfolio'), values: eq.map((e) => e.v), color: 'var(--accent)', fill: true }, { name: t('st.lgEtfShort'), values: eq.map((e) => st.capital * price('E1SIM', e.s) / b0), color: 'var(--c6)', dash: '5 4' }] });
    }
  };
  const all = () => { drawSyms(); drawChart(); drawKPIs(); drawEst(); drawBottom(); };
  const setSide = (s) => { StockUI.side = s; $$('#sideSeg button', root).forEach((x) => x.classList.toggle('on', x.dataset.side === s)); };

  $('#symList', root).addEventListener('click', (e) => { const b = e.target.closest('[data-sym]'); if (!b) return; st.symbol = b.dataset.sym; $('#ordSym', root).value = st.symbol; Store.save(); drawSyms(); drawChart(); drawEst(); });
  $('#ordSym', root).value = st.symbol;
  $('#ordSym', root).addEventListener('change', (e) => { st.symbol = e.target.value; Store.save(); drawSyms(); drawChart(); drawEst(); });
  $('#rangeSeg', root).addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; st.range = b.dataset.r; $$('#rangeSeg button', root).forEach((x) => x.classList.toggle('on', x === b)); Store.save(); drawChart(); });
  $('#ivSeg', root).addEventListener('click', (e) => { const b = e.target.closest('[data-iv]'); if (!b) return; st.interval = b.dataset.iv; $$('#ivSeg button', root).forEach((x) => x.classList.toggle('on', x === b)); Store.save(); drawChart(); });
  $('#maChk', root).addEventListener('change', (e) => { st.ma = e.target.checked; Store.save(); drawChart(); });
  $('#sideSeg', root).addEventListener('click', (e) => { const b = e.target.closest('[data-side]'); if (!b) return; setSide(b.dataset.side); StockUI.err = null; drawEst(); });
  const qty = $('#qty', root);
  qty.addEventListener('input', () => { if (!FormState.restoring) StockUI.err = null; drawEst(); });
  $('#qMinus', root).addEventListener('click', () => { qty.value = Math.max(0, (Math.round((+qty.value || 0) / 100) * 100) - 100); drawEst(); });
  $('#qPlus', root).addEventListener('click', () => { qty.value = (Math.round((+qty.value || 0) / 100) * 100) + 100; drawEst(); });
  $$('[data-pct]', root).forEach((b) => b.addEventListener('click', () => {
    const sym = $('#ordSym', root).value; const px = price(sym); const pc = +b.dataset.pct / 100;

  }));
  $('#placeBtn', root).addEventListener('click', () => {
    const sym = $('#ordSym', root).value; const q = +qty.value; const px = price(sym);
    const r = PortfolioEngine.execute(st.acc, StockUI.side, sym, q, px, { session: st.session });
    if (!r.ok) { StockUI.err = r.err; drawEst(); UI.toast(() => esc(tm(r.err)), 'error'); return; }
    StockUI.err = null; Store.save();
    const o = r.order; const msg = () => t(o.side === 'buy' ? 'st.toastBuy' : 'st.toastSell', { qty: Fmt.n(o.qty), sym: o.sym, px: Fmt.price(o.price) }) + (o.pnl !== null ? t('st.toastPnl', { pnl: Fmt.svnd(o.pnl) }) : '');
    Store.log(o.side === 'buy' ? 'log.buy' : 'log.sell', { qty: o.qty, sym: o.sym, px: o.price }, 'trade'); UI.toast(msg, 'success');
    all();
  });
  $('#bottom', root).addEventListener('click', (e) => { const b = e.target.closest('[data-sellall]'); if (!b) return; setSide('sell'); $('#ordSym', root).value = b.dataset.sellall; st.symbol = b.dataset.sellall; qty.value = st.acc.positions[b.dataset.sellall].qty; drawSyms(); drawChart(); drawEst(); $('#placeBtn', root).focus(); window.scrollTo({ top: $('.order-panel', root).getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); });
  $('#btTabs', root).addEventListener('click', (e) => { const b = e.target.closest('[data-bt]'); if (!b) return; StockUI.tab = b.dataset.bt; drawBottom(); });
  const adv = (n) => { const moved = SimulationEngine.stockAdvance(st, n); Store.save(); if (moved) UI.toast(() => t('st.advanced', { n: moved }), 'info', 1800); all(); };
  $('#next1', root).addEventListener('click', () => adv(1));
  $('#next5', root).addEventListener('click', () => adv(5));
  $('#howBtn', root).addEventListener('click', () => UI.modal({ build: () => ({ title: t('st.rulesTitle'), html: `<ul class="list-check"><li>${t('st.r1')}</li><li>${t('st.r2')}</li><li>${t('st.r3')}</li><li>${t('st.r4')}</li><li>${t('st.r5')}</li></ul>${UI.dataLabel()}` }) }));
  $('#resetStock', root).addEventListener('click', () => {
    let cap = st.capital / M;
    UI.modal({
      build: () => ({ title: t('st.resetTitle'), html: `<p class="text-2">${t('st.resetBody')}</p><div class="seg mt-12" id="rcap">${[50, 100, 500, 1000].map((c) => `<button type="button" data-c="${c}" class="${c === cap ? 'on' : ''}">${capLabel(c)}</button>`).join('')}</div>`,
        footer: `<button class="btn btn-secondary" data-close>${t('c.cancel')}</button><button class="btn btn-danger" data-act="go">${t('c.reset')}</button>` }),
      onMount(el, close) {
        el.addEventListener('click', (e) => {
          const b = e.target.closest('[data-c]'); if (b) { cap = +b.dataset.c; $$('#rcap button', el).forEach((x) => x.classList.toggle('on', x === b)); return; }
          if (e.target.closest('[data-act="go"]')) { Store.update((s) => { s.stock = SimulationEngine.newStock(cap * M); }); Store.log('log.stockReset', { amt: cap * M }); close(); UI.toast(() => t('st.resetDone'), 'success'); Router.refresh(); }
        });
      },
    });
  });
  all();
  return crumbs;
}

    const sc = hasS ? SimulationEngine.reCalc(re.inp, re.scen) : base; const show = sc;
    const dlt = (x, y, f = Fmt.sshort) => (hasS && Math.abs(x - y) > 1 ? `<span class="${x - y >= 0 ? 'pos' : 'neg'}">${x - y >= 0 ? '▲' : '▼'} ${t('re.vsBase', { d: f(x - y) })}</span>` : '');
    $('#reK', root).innerHTML = UI.kpi(t('re.kUpfront'), Fmt.short(show.upfront), t('re.kUpfrontS')) + UI.kpi(t('re.kPay'), Fmt.short(show.pay), hasS ? dlt(show.pay, base.pay) : t('re.kPayS', { amt: Fmt.short(show.loan), ltv: Fmt.pct(show.ltv, 0) }), { help: 'ltv' }) +
      UI.kpi(t('re.kCf'), `<span class="${show.cfM < 0 ? 'neg' : 'pos'}">${Fmt.sshort(show.cfM)}</span>`, hasS ? dlt(show.cfM, base.cfM) : show.cfM < 0 ? t('re.topUp') : t('re.surplusAfter'), { cls: 'accent', help: 'netcf' }) +
      UI.kpi(t('re.kNoi'), Fmt.short(show.noiM), t('re.kNoiS')) + UI.kpi(t('re.kYield'), Fmt.pct(show.grossYield, 1) + ' / ' + Fmt.pct(show.netYield, 1), t('re.firstYear'), { help: 'yield' }) +
      UI.kpi(t('re.kDebt'), Fmt.short(show.balEnd), t('re.afterN', { n: show.yrs })) + UI.kpi(t('re.kEquity'), Fmt.short(show.exitEquity), t('re.kEquityS', { amt: Fmt.short(show.exitValue) })) +
      UI.kpi(t('re.kProfit'), `<span class="${show.profit < 0 ? 'neg' : ''}">${Fmt.sshort(show.profit)}</span>`, t('re.kProfitS', { tot: Fmt.spct(show.roi, 1), yr: Fmt.spct(show.annual, 1) }));
    const ex = [];
    if (re.scen.rate) ex.push(t('re.exRate', { a: Fmt.short(base.pay), b: Fmt.short(sc.pay), d: Fmt.sshort(sc.pay - base.pay) }));
    if (re.scen.vacancy) ex.push(t('re.exVac', { a: Fmt.short(base.effRent), b: Fmt.short(sc.effRent) }));
    if (re.scen.repair) ex.push(t('re.exRepair', { d: Fmt.short(60 * M / 12) }));
    if (re.scen.price) ex.push(t('re.exPrice', { v: Fmt.short(sc.exitValue), ltv: Fmt.pct(base.ltv, 0), x: Fmt.n(1 / (1 - base.ltv), 1) }));
    if (re.scen.liquidity) ex.push(t('re.exLiq'));
    const cfNow = sc.cfM; const surplus = prof ? prof.surplus : null;
    const risk = cfNow < 0 ? t('re.cfNeg', { amt: Fmt.short(-cfNow) }) + (surplus !== null ? t('re.cfNegProfile', { amt: Fmt.short(surplus), flag: -cfNow > surplus ? t('re.cfNotEnough') : '' }) : '') + t('re.cfCum', { n: show.yrs, amt: Fmt.sshort(sc.cumCF) }) : t('re.cfPos', { amt: Fmt.short(cfNow) });
    $('#reExplain', root).innerHTML = (ex.length ? `<div class="notice warn">${Icons('alert')}<div>${ex.join('<br>')}<div class="mt-8">${t('re.exResult', { p1: Fmt.sshort(base.profit), p2: Fmt.sshort(sc.profit), c1: Fmt.sshort(base.cfM), c2: Fmt.sshort(sc.cfM) })}</div></div></div>` : `<div class="notice">${Icons('info')}<span>${t('re.noScen')}</span></div>`) +
      `<div class="notice ${cfNow < 0 ? 'neg' : 'pos'} mt-8">${Icons(cfNow < 0 ? 'alert' : 'checkc')}<span>${risk}</span></div>` +
      (base.ltv >= 0.5 ? `<div class="notice info mt-8">${Icons('info')}<span>${t('re.leverage', { ltv: Fmt.pct(base.ltv, 0) })}</span></div>` : '');
    const labels = sc.years.map((y) => t('c.year', { n: y.y }));
    const pad = hasS && sc.years.length > base.years.length ? [null] : [];
    const ser = [{ name: t('re.sEqBase'), values: base.years.map((y) => y.equity).concat(pad), color: 'var(--accent)' }, { name: t('re.sCfBase'), values: base.years.map((y) => y.cum).concat(pad), color: 'var(--c2)' }];
    if (hasS) ser.push({ name: t('re.sEqScen'), values: sc.years.map((y) => y.value * (re.scen.price ? 0.8 : 1) - y.bal), color: 'var(--accent)', dash: '5 4' }, { name: t('re.sCfScen'), values: sc.years.map((y) => y.cum), color: 'var(--c5)', dash: '5 4' });
    lineChart($('#reChart', root), { labels, height: 260, zero: true, series: ser });
    $('#reLegend', root).innerHTML = ser.map((s) => `<span><i style="background:${s.color};${s.dash ? 'opacity:.6' : ''}"></i>${s.name}</span>`).join('');
    $('#reCmpSub', root).textContent = hasS ? t('re.cmpVs', { list: active.map((k) => tx(SimulationEngine.RE_SCEN[k].label).toLowerCase()).join(' + ') }) : t('re.cmpNone');
    const rows = [['re.rPay', 'pay', Fmt.short], ['re.rCf', 'cfM', Fmt.sshort], ['re.rNet', 'netYield', (v) => Fmt.pct(v, 2)], ['re.rCum', 'cumCF', Fmt.sshort], ['re.rExit', 'exitValue', Fmt.short], ['re.rEq', 'exitEquity', Fmt.short], ['re.rProfit', 'profit', Fmt.sshort], ['re.rAnnual', 'annual', (v) => Fmt.spct(v, 1)]];
    $('#reCmp', root).innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('re.thMetric')}</th><th class="r">${t('re.thBase')}</th><th class="r">${hasS ? t('re.thScenN', { n: active.length }) : t('re.thScen')}</th><th class="r">${t('re.thDiff')}</th></tr></thead><tbody>${rows.map(([l, k, f]) => { const d = sc[k] - base[k]; return `<tr><td>${t(l)}</td><td class="r">${f(base[k])}</td><td class="r">${hasS ? f(sc[k]) : '—'}</td><td class="r">${hasS && Math.abs(d) > 1e-9 ? `<span class="${d >= 0 ? 'pos' : 'neg'}">${d >= 0 ? '▲' : '▼'} ${k === 'netYield' || k === 'annual' ? Fmt.spct(d, 2) : Fmt.sshort(d)}</span>` : '—'}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="xs muted mt-8">${t('re.cmpNote')}</p>`;
  };
  bindSliders(root, keys, fields.map((f) => f[5]), draw);
  $('#presets', root).addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (!b) return; re.preset = b.dataset.p; re.inp = Object.assign({}, P[re.preset]); Store.save(); Store.log('log.rePreset', { label: P[re.preset].label }); Router.refresh(); });
  $('#scen', root).addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (!b) return; re.scen[b.dataset.s] = !re.scen[b.dataset.s]; b.setAttribute('aria-pressed', String(re.scen[b.dataset.s])); if (re.scen[b.dataset.s]) Store.log('log.reScen', { label: SimulationEngine.RE_SCEN[b.dataset.s].label }); draw(); });
  $('#clrScen', root).addEventListener('click', () => { re.scen = {}; $$('#scen [data-s]', root).forEach((b) => b.setAttribute('aria-pressed', 'false')); draw(); });
  draw();
  return [{ label: t('nav.sim'), href: 'sim' }, { label: t('re.crumb') }];
}

/* ---------------- 9.4 PORTFOLIO ALLOCATION CHALLENGE ---------------- */
function renderAlloc(root) {
  if (!Store.state.alloc) Store.update((s) => { s.alloc = { w: Object.assign({}, SimulationEngine.ALLOC_PRESETS.balanced.w), scen: 'crash', last: null }; });
  const al = Store.state.alloc; const A = SimulationEngine.ALLOC_ASSETS; const SC = SimulationEngine.ALLOC_SCEN; const prof = Store.state.profile;
  root.innerHTML = `<button class="link-btn" data-go="sim" style="margin-bottom:14px">${Icons('back')} ${t('sim.backHub')}</button>
    ${R.pageHead(t('al.eyebrow') + ' ' + UI.simBadge(), t('al.title'), t('al.desc'))}
    <div class="grid g-12">
      <div class="card"><div class="card-h"><div><h2>${t('al.yours')}</h2><div class="sub">${t('al.presetsNote')}</div></div><span class="total-pill" id="tot"></span></div>
        <div class="row-wrap" style="margin-bottom:10px">${Object.entries(SimulationEngine.ALLOC_PRESETS).map(([k, p]) => `<button type="button" class="chip" data-pre="${k}">${tx(p.label)}</button>`).join('')}</div>
        <div id="rows">${A.map(([k, l, c]) => `<div class="alloc-row"><label for="al_${k}" class="small strong"><span class="sw" style="background:${c}"></span>${tx(l)}</label><input type="range" id="al_${k}" min="0" max="100" step="1" value="${al.w[k]}"><input type="number" id="aln_${k}" min="0" max="100" value="${al.w[k]}" aria-label="${esc(tx(l))} (%)"></div>`).join('')}</div>
        <div class="grid g-2 mt-16" style="align-items:center"><div id="donut" style="display:grid;place-items:center"></div><div class="stack-sm" id="conc"></div></div>
      </div>
      <div class="stack">
        <div class="card"><div class="card-h"><div><h2>${t('al.scenTitle')}</h2><div class="sub">${t('al.scenSub')}</div></div></div>
          <div class="scenario-grid" id="scs">${Object.entries(SC).map(([k, s]) => `<button type="button" class="scen" data-sc="${k}" aria-pressed="${al.scen === k}"><span class="s-t">${tx(s.label)}</span><span class="s-d" style="display:block">${tx(s.desc)}</span></button>`).join('')}</div>
          <div class="grid g-2 mt-16" id="alK"></div></div>
        <div class="card"><div class="card-h"><div><h2>${t('al.allTitle')}</h2><div class="sub">${t('al.allSub')}</div></div></div><div id="allSc"></div></div>
      </div>
    </div>
    <div class="grid g-2 mt-20"><div class="card"><div class="card-h"><h2>${t('al.byAsset')}</h2></div><div id="alTbl"></div></div>
      <div class="card"><div class="card-h"><h2>${t('al.divTitle')}</h2></div><div id="alEdu"></div></div></div>`;
  const setW = (k, v) => {
    v = clamp(Math.round(v), 0, 100); const others = A.map((x) => x[0]).filter((x) => x !== k); const rest = 100 - v; const curRest = sum(others.map((x) => al.w[x]));
    al.w[k] = v;
    if (curRest <= 0) { const each = Math.floor(rest / others.length); others.forEach((x, i) => { al.w[x] = each + (i < rest - each * others.length ? 1 : 0); }); }
    else { let acc = 0; others.forEach((x, i) => { if (i === others.length - 1) al.w[x] = rest - acc; else { al.w[x] = Math.round(al.w[x] / curRest * rest); acc += al.w[x]; } }); if (al.w[others[others.length - 1]] < 0) { const neg = al.w[others[others.length - 1]]; al.w[others[others.length - 1]] = 0; const big = others.reduce((x, y) => (al.w[x] > al.w[y] ? x : y)); al.w[big] += neg; } }
  };
  const draw = () => {
    A.forEach(([k]) => { const r = $('#al_' + k, root); r.value = al.w[k]; UI.setRangeFill(r); $('#aln_' + k, root).value = al.w[k]; });
    const tot = sum(A.map(([k]) => al.w[k])); $('#tot', root).textContent = t('al.total', { n: tot });
    $('#donut', root).innerHTML = donutSVG(A.map(([k, l, c]) => ({ v: al.w[k], color: c })), { center: '100 ' + t('u.mn').trim(), sub: t('al.virtualCap') });
    const hhi = SimulationEngine.hhi(al.w); const maxK = A.reduce((x, y) => (al.w[x[0]] >= al.w[y[0]] ? x : y));
    const riskW = (al.w.equity + al.w.re * 0.8 + al.w.gold * 0.5) / 100;
    $('#conc', root).innerHTML = `<div class="small"><span class="muted">${t('al.conc')} ${help('hhi')}</span><div class="strong" style="font-size:20px">${Fmt.n(hhi, 2)} <span class="small ${hhi > 0.4 ? 'neg' : hhi > 0.25 ? 'warn-c' : 'pos'}">${t(hhi > 0.4 ? 'al.concHigh' : hhi > 0.25 ? 'al.concMid' : 'al.concLow')}</span></div></div>${UI.bar(hhi, hhi > 0.4 ? 'neg' : hhi > 0.25 ? 'warn' : 'pos')}
      <div class="small mt-12"><span class="muted">${t('al.largest')}</span><div class="strong">${tx(maxK[1])} · ${al.w[maxK[0]]}%</div></div>
      <div class="small mt-8"><span class="muted">${t('al.volShare')}</span><div class="strong">${Fmt.pct(riskW, 0)}</div></div>
      ${prof ? `<div class="xs muted mt-8">${t('al.profileRef', { n: prof.effRisk })} ${riskW > [0, 0.15, 0.3, 0.5, 0.7, 0.9][prof.effRisk] ? `<span class="warn-c">${t('al.aboveRef')}</span>` : t('al.withinRef')} ${t('al.notAdvice')}</div>` : ''}`;
    const res = SimulationEngine.allocRun(al.w, al.scen); al.last = { scen: al.scen, ret: res.ret, end: res.end }; Store.save();
    $$('#scs [data-sc]', root).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sc === al.scen)));
    $('#alK', root).innerHTML = UI.kpi(t('al.kValue'), Fmt.short(res.end), tx(SC[al.scen].label), { cls: 'accent' }) + UI.kpi(t('al.kChange'), Fmt.delta(res.ret), Fmt.sshort(res.end - 100 * M));
    const all = Object.entries(SC).map(([k, s]) => ({ k, s, r: SimulationEngine.allocRun(al.w, k) }));
    const maxAbs = Math.max(...all.map((x) => Math.abs(x.r.ret)), 0.01);
    $('#allSc', root).innerHTML = all.map((x) => `<div class="vol-row" style="grid-template-columns:170px minmax(0,1fr) 80px"><span class="${x.k === al.scen ? 'strong' : ''}">${tx(x.s.label)}</span><div class="vol-track" style="background:transparent"><span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-strong)"></span><i style="opacity:1;background:${x.r.ret >= 0 ? 'var(--pos)' : 'var(--neg)'};left:${x.r.ret >= 0 ? 50 : 50 - Math.abs(x.r.ret) / maxAbs * 50}%;width:${Math.abs(x.r.ret) / maxAbs * 50}%"></i></div><span class="r">${Fmt.delta(x.r.ret)}</span></div>`).join('') +
      `<p class="xs muted mt-8">${t('al.range', { lo: Fmt.spct(Math.min(...all.map((x) => x.r.ret))), hi: Fmt.spct(Math.max(...all.map((x) => x.r.ret))) })}</p>`;
    $('#alTbl', root).innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('al.thGroup')}</th><th class="r">${t('st.thWeight')}</th><th class="r">${t('al.thAmt')}</th><th class="r">${t('al.thAssume')}</th><th class="r">${t('al.thAfter')}</th></tr></thead><tbody>${res.rows.map((r) => `<tr><td>${tx(r.label)}</td><td class="r">${r.w}%</td><td class="r">${Fmt.short(r.amt)}</td><td class="r">${Fmt.delta(r.ret, 'pct', 1)}</td><td class="r">${Fmt.short(r.end)}</td></tr>`).join('')}<tr><td class="strong">${t('c.total')}</td><td class="r strong">100%</td><td class="r strong">${Fmt.short(100 * M)}</td><td class="r strong">${Fmt.delta(res.ret)}</td><td class="r strong">${Fmt.short(res.end)}</td></tr></tbody></table></div>
      <details class="disclose mt-12"><summary>${t('al.assumpTable')}</summary><div class="d-b"><div class="table-wrap"><table class="tbl"><thead><tr><th>${t('al.thScen')}</th>${A.map(([, l]) => `<th class="r">${tx(l).split(' / ')[0]}</th>`).join('')}</tr></thead><tbody>${Object.values(SC).map((s) => `<tr><td>${tx(s.label)}</td>${A.map(([k]) => `<td class="r">${Fmt.spct(s.r[k], 1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="xs muted mt-8">${t('al.assumpNote')}</p></div></details>`;
    const worst = all.reduce((x, y) => (x.r.ret < y.r.ret ? x : y));
    $('#alEdu', root).innerHTML = `<p class="small text-2">${t('al.worst', { s: tx(worst.s.label), r: Fmt.spct(worst.r.ret) })}</p>
      <ul class="list-check mt-12"><li>${t('al.e1', { help: help('diversification') })}</li><li>${t('al.e2', { w: al.w[maxK[0]], name: tx(maxK[1]).toLowerCase() })}</li><li>${t('al.e3')}</li><li>${t('al.e4')}</li></ul>`;
  };
  A.forEach(([k]) => {
    $('#al_' + k, root).addEventListener('input', (e) => { setW(k, +e.target.value); draw(); });
    $('#aln_' + k, root).addEventListener('change', (e) => { setW(k, +e.target.value || 0); draw(); });
  });
  $$('[data-pre]', root).forEach((b) => b.addEventListener('click', () => { al.w = Object.assign({}, SimulationEngine.ALLOC_PRESETS[b.dataset.pre].w); draw(); }));
  $('#scs', root).addEventListener('click', (e) => { const b = e.target.closest('[data-sc]'); if (!b) return; al.scen = b.dataset.sc; draw(); Store.log('log.alloc', { label: SC[al.scen].label, spR: al.last.ret }); });
  draw();
  return [{ label: t('nav.sim'), href: 'sim' }, { label: t('al.crumb') }];
}

function renderLesson(root, l) {

  root.innerHTML = `<button class="link-btn" data-go="learn" style="margin-bottom:14px">${Icons('back')} ${t('nav.learn')}</button>
    <div class="page-head"><div><span class="eyebrow">${t('le.eyebrow', { g: tx(LESSON_GROUPS[l.group]), m: l.module })}</span><h1>${esc(tx(l.title))}</h1>
      <div class="lesson-meta mt-8"><span class="badge">${tx(DIFF[l.diff])}</span><span>${Icons('clock', 13)} ${t('le.read', { n: l.minutes })}</span><span>${t('le.relAsset')} <b>${tx(a.name)}</b></span><span id="lstat">${LearningEngine.isDone(l.id) ? `<span class="done-tag">${Icons('checkc')} ${t('le.done')}</span>` : ''}</span></div></div></div>

        ${l.sections.map((s) => `<h2>${esc(tx(s.h))}</h2>${s.p.map((x) => `<p>${tx(x)}</p>`).join('')}`).join('')}
        <div class="example"><div class="ex-t">${esc(tx(l.example.t))}</div>${tx(l.example.body)}</div>

        <form id="lq" novalidate>${l.quiz.map((q, i) => `<fieldset class="quiz-item" style="border:0;margin:0;padding:16px 0"><legend class="qi-q"><span class="n">${i + 1}</span><span>${esc(tx(q.q))}</span></legend><div class="qi-opts" role="radiogroup">${q.o.map((o, j) => `<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="lq_${i}" value="${j}"><span class="dot"></span><span class="o-t">${esc(tx(o))}</span></label>`).join('')}</div><div class="hint" id="lqe_${i}" hidden></div></fieldset>`).join('')}
          <div class="err" id="lqErr" role="alert"></div><div class="row-wrap mt-12"><button class="btn btn-primary" type="submit" id="lqSubmit">${t('le.submit')}</button><button class="btn btn-ghost" type="button" id="lqRetry" hidden>${t('le.retry')}</button></div><div id="lqRes" class="mt-16" aria-live="polite"></div></form>
      </article>
      <aside class="stack" style="position:sticky;top:84px">
        <div class="card"><div class="xs muted strong">${t('le.relAssetCap')}</div><div class="row mt-12">${R.assetIcon(a)}<div><div class="strong">${tx(a.name)}</div><div class="xs muted">${t('le.assetMeta', { r: a.risk, liq: tx(a.liqLabel) })}</div></div></div><button class="btn btn-secondary btn-sm btn-block mt-12" data-go="explore/${a.id}">${t('le.exploreAsset')}</button></div>
        <div class="card"><div class="xs muted strong">${t('le.practice')}</div><p class="small mt-8">${t('le.practiceD')}</p><button class="btn btn-primary btn-sm btn-block mt-12" data-go="${l.sim.route}">${Icons('play')} ${esc(tx(l.sim.label))}</button></div>
        <div class="card"><div class="xs muted strong">${t('le.next')}</div><button class="link-btn mt-8" data-go="learn/${next.id}" style="text-align:left">${esc(tx(next.title))} ${Icons('arrow')}</button></div>
      </aside>
    </div>`;
  if (l.tool) mountTool(l.tool, $('#lTool', root), a);
  const form = $('#lq', root);
  /** show graded feedback (also used to restore it after a language re-render) */
  const showResult = (ans, score, passed) => {
    l.quiz.forEach((q, i) => {
      const ok = ans[i] === q.c;
      $$(`[data-q="${i}"]`, form).forEach((lab) => { const j = +lab.dataset.o; lab.classList.toggle('correct', j === q.c); lab.classList.toggle('wrong', j === ans[i] && !ok); const inp = lab.querySelector('input'); inp.checked = j === ans[i]; inp.disabled = true; });
      const ex = $('#lqe_' + i, root); ex.hidden = false; ex.innerHTML = `<b class="${ok ? 'pos' : 'neg'}">${ok ? t('le.correct') : t('le.wrong')}</b> ${esc(tx(q.e))}`;
    });
    $('#lqSubmit', root).hidden = true; $('#lqRetry', root).hidden = false;
    $('#lqRes', root).innerHTML = passed
      ? `<div class="notice pos">${Icons('checkc')}<div><b>${t('le.passed', { s: score, total: l.quiz.length })}</b> ${t('le.passedD')}<div class="row-wrap mt-12"><button class="btn btn-primary btn-sm" data-go="${l.sim.route}">${Icons('play')} ${t('le.applyIn', { name: esc(tx(l.sim.label)) })}</button><button class="btn btn-secondary btn-sm" data-go="dashboard">${t('le.viewDash')}</button></div></div></div>`
      : `<div class="notice warn">${Icons('info')}<span>${t('le.failed', { s: score, total: l.quiz.length })}</span></div>`;
    $('#lstat', root).innerHTML = LearningEngine.isDone(l.id) ? `<span class="done-tag">${Icons('checkc')} ${t('le.done')}</span>` : '';
  };
  if (ui.submitted && ui.answers) { const sc = l.quiz.filter((q, i) => ui.answers[i] === q.c).length; showResult(ui.answers, sc, sc >= Math.ceil(l.quiz.length * 2 / 3)); }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const ans = l.quiz.map((q, i) => { const c = form.querySelector(`input[name="lq_${i}"]:checked`); return c ? +c.value : null; });
    if (ans.some((x) => x === null)) { $('#lqErr', root).innerHTML = Icons('alert', 15) + t('le.answerAll'); return; }
    $('#lqErr', root).textContent = '';
    const score = l.quiz.filter((q, i) => ans[i] === q.c).length;
    const passed = LearningEngine.complete(l.id, score, l.quiz.length);
    ui.answers = ans; ui.submitted = true;
    Store.log(passed ? 'log.lessonPass' : 'log.lesson', { title: l.title, s: score, total: l.quiz.length }, 'learn');
    showResult(ans, score, passed);
    UI.toast(() => (passed ? t('le.toastPass', { title: esc(tx(l.title)) }) : t('le.toastFail', { s: score, total: l.quiz.length })), passed ? 'success' : 'warn');
    App.renderSide();
  });
  $('#lqRetry', root).addEventListener('click', () => { ui.answers = null; ui.submitted = false; Router.refresh(); });
  return [{ label: t('nav.learn'), href: 'learn' }, { label: tx(l.title) }];
}

const Roadmap = {
  practiced() { const st = Store.state.stock; return !!((st && st.acc.orders.length > 0) || Store.state.histResults.length > 0); },
  fundamentals: ['emergency', 'compound', 'etf'],
  prereqsDone(p) { return p.reserveFunded && !p.highDebt && p.surplus > 0 && this.fundamentals.every((id) => LearningEngine.isDone(id)) && !!Store.state.flags.compared && this.practiced(); },
  build(p) {
    const steps = []; const F = Store.state.flags;
    if (p.surplus <= 0) steps.push({ t: t('rm.balanceT'), d: t('rm.balanceD', { amt: Fmt.sshort(p.surplus) }), done: false, go: 'learn/emergency', cta: t('rm.balanceC') });
    if (p.highDebt) steps.push({ t: t('rm.debtT'), d: t('rm.debtD'), done: false, go: 'profile/edit', cta: t('rm.debtC') });
    steps.push({ t: t('rm.reserveT'), d: p.reserveFunded ? t('rm.reserveOk', { n: p.months, amt: Fmt.short(p.reserveTarget) }) : t('rm.reserveShort', { amt: Fmt.short(p.reserveTarget), n: p.months, gap: Fmt.short(Math.max(0, p.reserveTarget - p.reserveHeld - p.earmarkReserve)) }), done: p.reserveFunded, go: 'learn/emergency', cta: t('rm.reserveC') });
    const nd = this.fundamentals.filter((id) => LearningEngine.isDone(id)).length;
    steps.push({ t: t('rm.lessonsT'), d: t('rm.lessonsD', { n: nd, list: this.fundamentals.map((id) => tx(LESSON[id].title)).join(' · ') }), done: nd === 3, go: 'learn/' + (this.fundamentals.find((id) => !LearningEngine.isDone(id)) || 'etf'), cta: t('rm.lessonsC') });
    steps.push({ t: t('rm.compareT'), d: F.compared ? t('rm.compareOk') : t('rm.compareD'), done: !!F.compared, go: 'explore', cta: t('rm.compareC') });
    steps.push({ t: t('rm.practiceT'), d: this.practiced() ? t('rm.practiceOk') : t('rm.practiceD'), done: this.practiced(), go: 'sim', cta: t('rm.practiceC') });
    const pre = steps.every((s) => s.done);
    steps.push({ t: t('rm.reviewT'), d: F.reviewed && pre ? t('rm.reviewOk') : t('rm.reviewD'), done: !!(F.reviewed && pre), go: 'profile/edit', cta: t('rm.reviewC') });
    const cur = steps.findIndex((s) => !s.done); if (cur >= 0) steps[cur].cur = true;
    return steps;
  },
};
