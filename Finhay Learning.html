            <div class="glass ph-card">
              <div class="between"><span class="pv-t">${t('pub.pvTitle')}</span><span class="pv-pill">${t('c.virtualMoney')}</span></div>
              ${[[t('pub.pv1'), 1, '✓'], [t('pub.pv2'), 0.62, '62%'], [t('pub.pv3'), 0.34, '34%']].map(([l, v, t]) => `<div class="pv-row"><span>${l}</span><b>${t}</b></div><div class="pv-bar"><i style="width:${v * 100}%"></i></div>`).join('')}
              <svg class="pv-spark" viewBox="0 0 300 90" preserveAspectRatio="none"><defs><linearGradient id="pvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D91F" stop-opacity=".45"/><stop offset="1" stop-color="#62D91F" stop-opacity="0"/></linearGradient></defs><path d="M0 72 C30 70 45 58 70 60 S110 40 135 46 175 30 200 26 245 22 265 12 300 6 300 6 V90 H0Z" fill="url(#pvg)"/><path d="M0 72 C30 70 45 58 70 60 S110 40 135 46 175 30 200 26 245 22 265 12 300 6 300 6" fill="none" stroke="#8BE85A" stroke-width="2.5"/></svg>
            </div>
            <div class="glass ph-chip c1"><span class="pc-ic">${Icons('checkc', 16)}</span><span><b>${t('pub.chip1')}</b><small>${t('pub.chip1s')}</small></span></div>
            <div class="glass ph-chip c2"><span class="pc-ic">${Icons('wallet', 16)}</span><span><b>${Fmt.vnd(100 * M)}</b><small>${t('pub.chip2s')}</small></span></div>
            <div class="glass ph-chip c3"><span class="pc-ic">${Icons('shield', 16)}</span><span><b>${t('pub.chip3')}</b><small>${t('pub.chip3s')}</small></span></div>
          </div>
        </div>
      </section>

      <section class="pub-sec" id="features" aria-labelledby="ftTitle">
        <div class="pub-wrap">
          <div class="pub-head"><span class="eyebrow">${t('pub.ftEyebrow')}</span><h2 id="ftTitle">${t('pub.ftTitle')}</h2></div>
          <div class="pub-feats">${feats.map(([ic, t, d, list], i) => `<article class="pf"><div class="pf-top"><span class="pf-ic">${Icons(ic, 22)}</span><span class="pf-n">0${i + 1}</span></div><h3>${t}</h3><p>${d}</p><ul>${list.map((x) => `<li>${Icons('check', 15)}${x}</li>`).join('')}</ul></article>`).join('')}</div>
        </div>
      </section>

      <section class="pub-sec alt" id="about" aria-labelledby="abTitle">
        <div class="pub-wrap pub-about">
          <div><span class="eyebrow">${t('pub.abEyebrow')}</span><h2 id="abTitle">${t('pub.abTitle')}</h2>
            <p>${t('pub.abText')}</p>
            <div class="cta-row"><button class="btn btn-primary" data-go="login">${t('pub.abCta')} ${Icons('arrow')}</button></div></div>
          <ul class="pub-points">
            <li><span>${Icons('scale', 18)}</span><div><b>${t('pub.p1t')}</b><p>${t('pub.p1d')}</p></div></li>
            <li><span>${Icons('lock', 18)}</span><div><b>${t('pub.p2t')}</b><p>${t('pub.p2d')}</p></div></li>
            <li><span>${Icons('book', 18)}</span><div><b>${t('pub.p3t')}</b><p>${t('pub.p3d')}</p></div></li>
          </ul>
        </div>
      </section>
    </main>
    <footer class="pub-foot"><div class="pub-wrap between">${Brand.wordmark(30)}<p>${Brand.disclaimer}</p></div></footer>`;
    this.bindScroll(host);
  },

  bindScroll(host) {
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-scroll]'); if (!b) return;
      const id = b.dataset.scroll;
      if (id === 'top') window.scrollTo({ top: 0, behavior: 'smooth' });
      else { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' }); }
      $$('.pub-nav button', host).forEach((x) => x.classList.toggle('on', x === b));
    });
  },

  login(host, next, keep) {
    const safeNext = next && Views[next.split('/')[0]] ? next : '';
    host.innerHTML = `<div class="login">
      <section class="login-art" aria-label="${t('lg.artAria')}">
        <span class="la-deco d1" aria-hidden="true"></span><span class="la-deco d2" aria-hidden="true"></span><span class="la-deco d3" aria-hidden="true"></span>
        <a href="#/welcome" class="la-logo" aria-label="${esc(t('lg.logoAria', { name: Brand.name }))}">${Brand.wordmark(40)}</a>
        <div class="la-copy">
          <h1>${t('lg.h1')}</h1>
          <p>${t('lg.lead')}</p>
          <ul class="la-points"><li>${Icons('checkc', 17)} ${t('lg.pt1')}</li><li>${Icons('checkc', 17)} ${t('lg.pt2')}</li><li>${Icons('checkc', 17)} ${t('lg.pt3')}</li></ul>
        </div>
        <svg class="la-illus" viewBox="0 0 480 280" aria-hidden="true">
          <defs><linearGradient id="lab" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#62D91F" stop-opacity=".12"/><stop offset="1" stop-color="#62D91F" stop-opacity=".85"/></linearGradient></defs>
          <line x1="16" y1="262" x2="464" y2="262" stroke="rgba(255,255,255,.14)"/>
          ${[[50, 48], [130, 86], [210, 128], [290, 168], [370, 212]].map(([x, h], i) => `<rect x="${x}" y="${262 - h}" width="54" height="${h}" rx="14" fill="url(#lab)" opacity="${0.45 + i * 0.12}"/>`).join('')}
          <path d="M30 236C120 228 170 190 250 150S380 70 448 40" fill="none" stroke="#8BE85A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
          <g transform="translate(397 28)"><path d="M0 22C0 9 8 1 22 0c0 13-8 22-22 22Z" fill="#62D91F"/><path d="M1 21 15 7" stroke="#182713" stroke-width="2" stroke-linecap="round"/><path d="M0 22c-9-1-14-7-13-15 8 0 13 6 13 15Z" fill="#8BE85A" opacity=".7"/></g>
          <circle cx="448" cy="40" r="6" fill="#62D91F"/><circle cx="448" cy="40" r="13" fill="none" stroke="#62D91F" stroke-opacity=".35"/>
        </svg>
      </section>
      <section class="login-side">
        <div class="login-top">${langSwitch()}<button class="btn btn-secondary btn-icon" data-theme-toggle></button></div>
        <form class="login-card" id="loginForm" novalidate aria-labelledby="lgTitle">
          <span class="login-mark">${Brand.mark(48)}</span>
          <h2 id="lgTitle">${t('lg.welcome')}</h2>
          <p class="login-sub">${t('lg.sub')}</p>
          ${safeNext ? `<div class="notice info small" style="margin-bottom:16px">${Icons('lock')}<span>${t('lg.next')}</span></div>` : ''}
          <div class="lf"><label for="lgUser">${t('lg.user')}</label><input type="text" id="lgUser" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="${t('lg.userPh')}" aria-describedby="lgErr"></div>
          <div class="lf"><label for="lgPass">${t('lg.pass')}</label><div class="lf-pw"><input type="password" id="lgPass" name="password" autocomplete="current-password" placeholder="${t('lg.passPh')}" aria-describedby="lgErr"><button type="button" class="lf-eye" id="lgEye" aria-label="${t('lg.show')}" aria-pressed="false" aria-controls="lgPass">${Icons('eye', 19)}</button></div></div>
          <div class="login-err" id="lgErr" role="alert" aria-live="assertive" hidden></div>
          <button class="btn btn-primary btn-lg btn-block login-btn" type="submit" id="lgBtn">${t('lg.submit')}</button>
          <a href="#/welcome" class="login-back">${Icons('back', 16)} ${t('lg.backHome')}</a>
          <p class="login-note">${Icons('info', 14)} ${t('lg.note')}</p>
        </form>
        <p class="login-disc">${Brand.disclaimer}</p>
      </section>
    </div>`;
    const form = $('#loginForm', host), user = $('#lgUser', host), pass = $('#lgPass', host), err = $('#lgErr', host), btn = $('#lgBtn', host), eye = $('#lgEye', host);
    if (!keep) Public.loginErr = null;
    const showErr = (key) => { Public.loginErr = key; err.innerHTML = Icons('alert', 17) + `<span>${esc(t(key))}</span>`; err.hidden = false; };
    if (Public.loginErr) showErr(Public.loginErr); // keep a visible validation message across a language switch
    const clearErr = () => { Public.loginErr = null; err.hidden = true; user.classList.remove('invalid'); pass.classList.remove('invalid'); user.removeAttribute('aria-invalid'); pass.removeAttribute('aria-invalid'); };
    [user, pass].forEach((i) => i.addEventListener('input', clearErr));
    eye.addEventListener('click', () => {
      const show = pass.type === 'password'; pass.type = show ? 'text' : 'password';
      eye.setAttribute('aria-pressed', String(show)); eye.setAttribute('aria-label', t(show ? 'lg.hide' : 'lg.show')); eye.innerHTML = Icons(show ? 'eyeoff' : 'eye', 19);
    });
    let busy = false;
    form.addEventListener('submit', (e) => {
      e.preventDefault(); if (busy) return; clearErr();
      const u = user.value.trim(), p = pass.value;
      if (!u || !p) {
        showErr('lg.errEmpty');
        [[user, !u], [pass, !p]].forEach(([el, bad]) => { if (bad) { el.classList.add('invalid'); el.setAttribute('aria-invalid', 'true'); } });
        (!u ? user : pass).focus(); return;
      }
      busy = true; btn.disabled = true; btn.classList.add('loading'); btn.innerHTML = `<span class="spin" aria-hidden="true"></span> ${t('lg.loading')}`;
      setTimeout(() => {
        const ok = Auth.login(u, p);
        if (!ok) {
          busy = false; btn.disabled = false; btn.classList.remove('loading'); btn.textContent = t('lg.submit');
          showErr('lg.errWrong');
          pass.classList.add('invalid'); pass.setAttribute('aria-invalid', 'true'); pass.focus(); pass.select(); return;
        }
        pass.value = ''; // never keep the password around after success
        btn.classList.remove('loading'); btn.classList.add('success'); btn.innerHTML = Icons('check', 18) + ' ' + t('lg.success'); Public.loginErr = null;
        setTimeout(() => {
          Store.log('log.login', { user: Auth.user });
          Router.go(safeNext || 'overview');
          UI.toast(() => t('lg.welcomeToast', { user: esc(Auth.user) }), 'success', 4200);
        }, 450);
      }, 550);
    });
    if (!keep) setTimeout(() => user.focus({ preventScroll: true }), 50);
  },
};

/* ---------- boot ---------- */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init()); else App.init();
</script>
</body>
</html>
